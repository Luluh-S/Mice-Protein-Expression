<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/*BASE*/
.hero {
  position: relative;
  height: 100vh;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  overflow: hidden;
  background:
    radial-gradient(900px 560px at 74% 46%, rgba(217, 85, 122, .10), transparent 62%),
    radial-gradient(600px 400px at 10% 110%, rgba(75, 91, 179, .08), transparent 60%),
    #ffffff;
  color: var(--ink);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.copy {
  position: relative;
  z-index: 2;
  width: 46%;
  min-width: 340px;
  height: 100%;
  padding: 64px 0 56px 64px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}
.pill {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 500 13px var(--font-text);
  color: var(--ink-2);
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface);
}
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(52px, 7.2vw, 104px);
  font-weight: 300;
  line-height: .94;
  letter-spacing: -0.04em;
}
h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
.lead { margin: 0; max-width: 36ch; font-size: 18px; line-height: 1.6; color: var(--muted); }
.stats { display: flex; gap: 0; margin-top: 16px; border-top: 1px solid var(--line-2); }
.stat { padding: 16px 28px 0 0; }
.stat + .stat { padding-left: 24px; border-left: 1px solid var(--line); }
.stat b {
  display: block;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 40px;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat span { font: 500 13px var(--font-text); color: var(--muted); }
.axis { position: absolute; z-index: 1; font: 500 13px var(--font-text); color: var(--faint, #a3a7bb); }
@media (max-width: 760px) {
  .copy { width: 100%; min-width: 0; height: auto; padding: 32px 22px 0; }
  .stats { gap: 0; }
  .stat { padding: 14px 14px 0 0; }
  .stat + .stat { padding-left: 14px; }
  .stat b { font-size: 32px; }
}
</style>
</head>
<body>
<div class="hero" id="hero">
  <canvas id="cv"></canvas>
  <div class="copy">
    <span class="pill"><i></i>Mini project · K-Means before and after PCA</span>
    <h1>Pondering the <em>clusters.</em></h1>
    <p class="lead">1,080 brain samples from 72 mice, 77 proteins each. We let K-Means find the groups: first with every protein, then after PCA shrinks them down to two.</p>
    <div class="stats" id="stats"></div>
  </div>
  <span class="axis" id="axx">PC1 →</span>
  <span class="axis" id="axy">↑ PC2</span>
  <button class="pause" id="pause" aria-label="Pause animation"></button>
</div>
<script>
const D = /*DATA*/null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hero = document.getElementById('hero');

// stats, final figures written first so they read right without motion
const stats = document.getElementById('stats');
D.stats.forEach(s => {
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = `<b data-v="${s.value}" data-dec="${s.dec || 0}" data-suf="${s.suffix || ''}">${fmt(s.value, s.dec, s.suffix)}</b><span>${s.label}</span>`;
  stats.appendChild(el);
});
function fmt(v, dec, suf) { return Number(v).toLocaleString('en-US', {minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0}) + (suf || ''); }
if (!reduce) {
  const t0 = performance.now();
  const els = [...stats.querySelectorAll('b')];
  els.forEach(b => b.style.minWidth = b.offsetWidth + 'px');
  (function count(now) {
    const p = Math.min(1, (now - t0) / 1000);
    const e = 1 - Math.pow(1 - p, 3);
    els.forEach(b => b.textContent = fmt(+b.dataset.v * e, +b.dataset.dec, b.dataset.suf));
    if (p < 1) requestAnimationFrame(count);
  })(t0);
}

// points
const N = D.x.length;
let W = 0, H = 0, dpr = 1, box = null;
const start = new Float32Array(N * 2), seed = new Float32Array(N);
for (let i = 0; i < N; i++) {
  seed[i] = Math.random();
  const a = i * 2.39996; // golden angle spiral, a tight swirl in the middle of the dish
  const r = Math.sqrt(i / N);
  start[i * 2] = Math.cos(a) * r;
  start[i * 2 + 1] = Math.sin(a) * r;
}

function layout() {
  const r = hero.getBoundingClientRect();
  W = r.width; H = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  const narrow = W < 760;
  // on phones the text sits on top and the dots get their own space underneath
  const copyBottom = narrow ? document.querySelector('.copy').offsetHeight : 0;
  const left = narrow ? 30 : W * 0.46, right = narrow ? W - 30 : W - 40;
  const top = narrow ? copyBottom + 60 : 48, bottom = H - 56;
  box = {left, right, top, bottom, cx: (left + right) / 2, cy: (top + bottom) / 2};
  document.getElementById('axx').style.cssText = `left:${right - 52}px;top:${box.cy + 8}px`;
  document.getElementById('axy').style.cssText = `left:${box.cx + 8}px;top:${top - 8}px`;
}

function toScreen(x, y) {
  return [box.left + (x + 1) / 2 * (box.right - box.left), box.bottom - (y + 1) / 2 * (box.bottom - box.top)];
}

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let t0 = performance.now(), paused = false, pausedAt = 0, offset = 0;
const push = new Float32Array(N * 2), PUSH_R = 90, PUSH = 30;
const pointer = {x: 0, y: 0, on: false};
hero.addEventListener('pointermove', e => {
  const r = hero.getBoundingClientRect();
  pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top; pointer.on = true;
});
hero.addEventListener('pointerleave', () => { pointer.on = false; });
const ASSEMBLE = reduce ? 0 : 1100;

function frame(now) {
  const t = paused ? pausedAt : now - offset;
  const el = t - t0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // a petri dish under the points: a soft disc, its rim and an inner ring
  const plateR = Math.min(box.right - box.left, box.bottom - box.top) * 0.62;
  const pg = ctx.createRadialGradient(box.cx, box.cy, plateR * 0.2, box.cx, box.cy, plateR);
  pg.addColorStop(0, 'rgba(75,91,179,.05)');
  pg.addColorStop(0.85, 'rgba(75,91,179,.03)');
  pg.addColorStop(1, 'rgba(75,91,179,0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(box.cx, box.cy, plateR, 0, 6.2832); ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(29,35,64,.14)';
  ctx.beginPath(); ctx.arc(box.cx, box.cy, plateR * 0.96, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = 'rgba(29,35,64,.08)';
  ctx.beginPath(); ctx.arc(box.cx, box.cy, plateR * 0.78, 0, 6.2832); ctx.stroke();

  // faint axes through the middle of the cloud
  const [ox, oy] = toScreen(0, 0);
  ctx.strokeStyle = 'rgba(29,35,64,.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(box.left, oy); ctx.lineTo(box.right, oy);
  ctx.moveTo(ox, box.top); ctx.lineTo(ox, box.bottom);
  ctx.stroke();

  const potR = Math.min(box.right - box.left, box.bottom - box.top) * 0.18;
  for (let i = 0; i < N; i++) {
    const delay = seed[i] * 250;
    const p = ASSEMBLE ? Math.max(0, Math.min(1, (el - delay) / (ASSEMBLE - 250))) : 1;
    const e = ease(p);
    const sx = box.cx + start[i * 2] * potR, sy = box.cy + start[i * 2 + 1] * potR;
    let [tx, ty] = toScreen(D.x[i], D.y[i]);
    // drift: a small bob on one 3.2 s cycle once the points have settled
    if (p >= 1 && !reduce) {
      const ph = seed[i] * Math.PI * 2;
      tx += Math.cos((el / 3200) * Math.PI * 2 + ph) * 1.4;
      ty += Math.sin((el / 3200) * Math.PI * 2 + ph) * 1.4;
    }
    let x = sx + (tx - sx) * e, y = sy + (ty - sy) * e;
    // the cursor gently pushes nearby points away; they drift back when it leaves
    let wantX = 0, wantY = 0, near = 0;
    if (pointer.on && p >= 1 && !reduce) {
      const dx = x - pointer.x, dy = y - pointer.y, d = Math.hypot(dx, dy);
      if (d < PUSH_R && d > 0.01) {
        near = 1 - d / PUSH_R;
        const f = near * near * PUSH;
        wantX = dx / d * f; wantY = dy / d * f;
      }
    }
    push[i * 2] += (wantX - push[i * 2]) * 0.14;
    push[i * 2 + 1] += (wantY - push[i * 2 + 1]) * 0.14;
    x += push[i * 2]; y += push[i * 2 + 1];
    const c = D.palette[D.c[i]];
    ctx.globalAlpha = 0.10 + near * 0.16;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x, y, 6.5 + near * 3, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(x, y, 2.4 + near * 1.2, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!reduce) requestAnimationFrame(frame);
}

const pauseBtn = document.getElementById('pause');
const PAUSE = '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/></svg>';
const PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5v9l7.5-4.5z"/></svg>';
pauseBtn.innerHTML = PAUSE;
pauseBtn.onclick = () => {
  if (!paused) { paused = true; pausedAt = performance.now() - offset; pauseBtn.innerHTML = PLAY; pauseBtn.setAttribute('aria-label', 'Play animation'); }
  else { offset = performance.now() - pausedAt; paused = false; pauseBtn.innerHTML = PAUSE; pauseBtn.setAttribute('aria-label', 'Pause animation'); }
};

layout();
new ResizeObserver(() => { layout(); if (reduce) frame(performance.now()); }).observe(hero);
requestAnimationFrame(frame);
</script>
</body>
</html>
