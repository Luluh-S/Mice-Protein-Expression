<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/*BASE*/
.wrap { position: relative; height: 100vh; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.title { font-family: var(--font-display); font-size: 26px; font-weight: 400; letter-spacing: -0.01em; }
.sub { font: 500 13px var(--font-text); color: var(--muted); margin-top: 2px; }
.controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.ctl { display: flex; align-items: center; }
.stage { position: relative; flex: 1; min-height: 0; border-radius: 12px; background: radial-gradient(70% 80% at 50% 45%, #ffffff 0%, #f6f3f5 100%); border: 1px solid var(--line); overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px var(--font-text); color: var(--ink);
  padding: 6px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  cursor: pointer; user-select: none;
  transition: border-color 140ms var(--ease), background-color 140ms var(--ease), opacity 200ms var(--ease), transform 140ms var(--ease);
}
.chip:hover { border-color: var(--line-2); transform: translateY(-1px); }
.chip:active { transform: translateY(1px) scale(.985); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; }
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.off { opacity: .45; }
.chip.locked { border-color: var(--ink); }
.note {
  font: 400 15px/1.5 var(--font-text); color: var(--ink);
  display: flex; gap: 10px; align-items: flex-start;
  min-height: 24px;
  transition: opacity 200ms var(--ease);
}
.note .mk { flex: none; margin-top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font: 700 11px var(--font-text); }
.note.swap { opacity: 0; }
</style>
</head>
<body>
<div class="wrap panel">
  <div class="head">
    <div><div class="title" id="title"></div><div class="sub" id="sub"></div></div>
    <div class="controls" id="controls"></div>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
  <div class="legend" id="legend"></div>
  <div class="note" id="note"></div>
</div>
<script>
const D = /*DATA*/null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = D.ids.length;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), tip = document.getElementById('tip');
document.getElementById('title').textContent = D.title || '';
document.getElementById('sub').textContent = D.subtitle || '';

let mode = D.modes.find(m => m.id === D.mode) || D.modes[0];
let view = D.views.find(v => v.id === D.view) || D.views[0];
let solo = null, hover = null;

// segmented controls with one sliding indicator
function seg(label, items, current, onPick) {
  if (items.length < 2) return;
  const wrap = document.createElement('div');
  wrap.className = 'ctl';
  wrap.innerHTML = `<span class="seg-label">${label}</span><div class="seg"><span class="ind"></span></div>`;
  const s = wrap.querySelector('.seg'), ind = s.querySelector('.ind');
  const btns = items.map(it => {
    const b = document.createElement('button');
    b.textContent = it.label;
    b.setAttribute('aria-pressed', it.id === current.id);
    b.onclick = () => { btns.forEach(o => o.setAttribute('aria-pressed', o === b)); place(b); onPick(it); };
    s.appendChild(b);
    return b;
  });
  function place(b) { ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft - 4}px)`; }
  document.getElementById('controls').appendChild(wrap);
  requestAnimationFrame(() => {
    ind.style.transition = 'none';
    place(btns.find(b => b.getAttribute('aria-pressed') === 'true'));
    requestAnimationFrame(() => ind.style.transition = '');
  });
  new ResizeObserver(() => place(btns.find(b => b.getAttribute('aria-pressed') === 'true'))).observe(s);
}
seg('Color by', D.modes, mode, m => { mode = m; solo = null; retarget(true); legend(); note(); });
seg('View', D.views, view, v => { view = v; retarget(true); note(); });

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const cur = new Float32Array(N * 6), from = new Float32Array(N * 6), to = new Float32Array(N * 6);
let W = 0, H = 0, dpr = 1, M = {l: 48, r: 18, t: 18, b: 36}, bounds = null;
let anim = null;

function computeBounds() {
  const xs = D.x[view.x], ys = D.x[view.y];
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = (x1 - x0) * .06, py = (y1 - y0) * .08;
  bounds = {x0: x0 - px, x1: x1 + px, y0: y0 - py, y1: y1 + py};
}
const SX = v => M.l + (v - bounds.x0) / (bounds.x1 - bounds.x0) * (W - M.l - M.r);
const SY = v => H - M.b - (v - bounds.y0) / (bounds.y1 - bounds.y0) * (H - M.t - M.b);

function alphaFor(g) {
  const focus = hover ?? solo;
  return focus === null ? 0.9 : (g === focus ? 0.95 : 0.1);
}
function fillTargets() {
  computeBounds();
  const xs = D.x[view.x], ys = D.x[view.y];
  for (let i = 0; i < N; i++) {
    const g = mode.values[i], c = hex(mode.colors[g]);
    to.set([SX(xs[i]), SY(ys[i]), c[0], c[1], c[2], alphaFor(g)], i * 6);
  }
}
function retarget(animate, dur = 620) {
  fillTargets();
  if (!animate || reduce) { cur.set(to); anim = null; draw(); return; }
  from.set(cur);
  anim = {t0: performance.now(), dur};
  requestAnimationFrame(tick);
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tick(now) {
  if (!anim) return;
  const p = Math.min(1, (now - anim.t0) / anim.dur), e = ease(p);
  for (let k = 0; k < N * 6; k++) cur[k] = from[k] + (to[k] - from[k]) * e;
  draw();
  if (p < 1) requestAnimationFrame(tick); else anim = null;
}

function niceTicks(a, b, n) {
  const step0 = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];
  for (let v = Math.ceil(a / step) * step; v <= b; v += step) out.push(+v.toFixed(8));
  return out;
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.font = '500 12px var(--font-text)';
  ctx.fillStyle = '#6b7088';
  ctx.strokeStyle = 'rgba(29,35,64,.07)';
  ctx.lineWidth = 1;
  niceTicks(bounds.x0, bounds.x1, 6).forEach(v => {
    const x = SX(v); ctx.beginPath(); ctx.moveTo(x, M.t); ctx.lineTo(x, H - M.b); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillText(v, x, H - M.b + 18);
  });
  niceTicks(bounds.y0, bounds.y1, 5).forEach(v => {
    const y = SY(v); ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(W - M.r, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(v, M.l - 8, y + 4);
  });
  ctx.strokeStyle = 'rgba(29,35,64,.24)';
  if (bounds.x0 < 0 && bounds.x1 > 0) { ctx.beginPath(); ctx.moveTo(SX(0), M.t); ctx.lineTo(SX(0), H - M.b); ctx.stroke(); }
  if (bounds.y0 < 0 && bounds.y1 > 0) { ctx.beginPath(); ctx.moveTo(M.l, SY(0)); ctx.lineTo(W - M.r, SY(0)); ctx.stroke(); }
  ctx.fillStyle = '#1d2340'; ctx.textAlign = 'right';
  ctx.fillText(view.xl || view.x.toUpperCase(), W - M.r, H - M.b - 8);
  ctx.textAlign = 'left';
  ctx.fillText(view.yl || view.y.toUpperCase(), M.l + 8, M.t + 12);

  // dimmed points first, focused ones on top
  for (const pass of [0, 1]) {
    for (let i = 0; i < N; i++) {
      const o = i * 6, a = cur[o + 5];
      if ((a > 0.5) !== (pass === 1)) continue;
      ctx.fillStyle = `rgba(${cur[o + 2] | 0},${cur[o + 3] | 0},${cur[o + 4] | 0},${a})`;
      ctx.beginPath(); ctx.arc(cur[o], cur[o + 1], hoverIdx === i ? 6 : 3.6, 0, 6.2832); ctx.fill();
    }
  }
  if (hoverIdx !== null) {
    const o = hoverIdx * 6;
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cur[o], cur[o + 1], 8, 0, 6.2832); ctx.stroke();
  }
}

function layout(first) {
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  fillTargets();
  if (first && !reduce) {
    for (let i = 0; i < N; i++) {
      cur.set([W / 2 + (Math.random() - .5) * 8, H / 2 + (Math.random() - .5) * 8, to[i * 6 + 2], to[i * 6 + 3], to[i * 6 + 4], 0], i * 6);
    }
    from.set(cur);
    anim = {t0: performance.now(), dur: 1000};
    requestAnimationFrame(tick);
  } else { cur.set(to); draw(); }
}

// legend chips: hover to focus a group, click to keep it focused
const legendEl = document.getElementById('legend');
function legend() {
  const counts = mode.names.map(() => 0);
  mode.values.forEach(g => counts[g]++);
  legendEl.innerHTML = '';
  mode.names.forEach((name, g) => {
    if (!counts[g]) return;
    const c = document.createElement('button');
    c.className = 'chip';
    c.dataset.g = g;
    c.innerHTML = `<i style="background:${mode.colors[g]}"></i>${name}<span>${counts[g]}</span>`;
    c.onmouseenter = c.onfocus = () => { hover = g; refocus(); };
    c.onmouseleave = c.onblur = () => { hover = null; refocus(); };
    c.onclick = () => { solo = solo === g ? null : g; refocus(); };
    legendEl.appendChild(c);
  });
  refocus(false);
}
function refocus(animate = true) {
  const focus = hover ?? solo;
  [...legendEl.children].forEach(c => {
    const g = +c.dataset.g;
    c.classList.toggle('off', focus !== null && g !== focus);
    c.classList.toggle('locked', solo !== null && g === solo);
  });
  if (!animate) return;
  if (anim) { fillTargets(); return; }
  retarget(true, 220);
}

const noteEl = document.getElementById('note');
function note() {
  const txt = (D.notes || {})[`${mode.id}|${view.id}`] ?? (D.notes || {})[mode.id] ?? '';
  noteEl.classList.add('swap');
  setTimeout(() => {
    noteEl.innerHTML = txt ? `<span class="mk">i</span><span>${txt}</span>` : '';
    noteEl.classList.remove('swap');
  }, reduce ? 0 : 160);
}

// tooltip on the nearest point
let hoverIdx = null;
stage.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 144;
  for (let i = 0; i < N; i++) {
    if (cur[i * 6 + 5] < 0.5) continue;
    const dx = cur[i * 6] - mx, dy = cur[i * 6 + 1] - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best !== hoverIdx) { hoverIdx = best; if (!anim) draw(); }
  if (best === null) { tip.classList.remove('on'); return; }
  const g = mode.values[best];
  tip.innerHTML = `<b>Mouse ${D.ids[best]}</b><br><span class="sw" style="background:${mode.colors[g]}"></span>${mode.label}: ${mode.names[g]}<br>Class ${D.cls[best]}`;
  const tx = cur[best * 6] + 14, flip = tx + tip.offsetWidth > W - 8;
  tip.style.left = (flip ? cur[best * 6] - tip.offsetWidth - 14 : tx) + 'px';
  tip.style.top = Math.max(4, cur[best * 6 + 1] - 24) + 'px';
  tip.classList.add('on');
});
stage.addEventListener('mouseleave', () => { hoverIdx = null; tip.classList.remove('on'); if (!anim) draw(); });

legend(); note();
let started = false;
new ResizeObserver(() => { layout(!started); started = true; }).observe(stage);
</script>
</body>
</html>
